name: Routing benchmark
# Same pinned workloads on whichever host the runner lands on, to measure per-CPU slowdown (CLO-5206 phase 1).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        required: true
        default: tenki-standard-medium-4c-8g
        type: string
      repeats:
        description: Runs per workload (JSON list of ids)
        required: true
        default: '[1,2,3,4,5]'
        type: string
      tag:
        description: Free-form label for this batch (e.g. lbm-18 or lbm-21)
        required: true
        type: string

run-name: routing-bench ${{ inputs.tag }} on ${{ inputs.runner }}

jobs:
  bench:
    name: ${{ matrix.workload }} (${{ inputs.tag }} ${{ matrix.rep }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        workload: [rust-compile, go-build-test, ts-typecheck, io-bound]
        rep: ${{ fromJSON(inputs.repeats) }}
    steps:
      - name: Host info
        run: |
          nproc; free -g | head -2; grep -m1 'model name' /proc/cpuinfo || true
          cat /proc/pressure/cpu 2>/dev/null || echo "no psi"

      - name: rust-compile (ripgrep 14.1.1 release build)
        if: matrix.workload == 'rust-compile'
        run: |
          git clone --depth 1 --branch 14.1.1 https://github.com/BurntSushi/ripgrep.git rg
          cd rg
          cargo fetch --locked
          for i in 1 2 3 4; do
            cargo clean -q
            /usr/bin/time -f "round $i: %e s, %P cpu" cargo build --release --locked --offline -q
          done

      - name: go-build-test (caddy v2.8.4 build + unit tests)
        if: matrix.workload == 'go-build-test'
        run: |
          git clone --depth 1 --branch v2.8.4 https://github.com/caddyserver/caddy.git caddy
          cd caddy
          go mod download
          for i in 1 2; do
            go clean -cache
            /usr/bin/time -f "build round $i: %e s, %P cpu" go build ./...
          done
          /usr/bin/time -f "test: %e s, %P cpu" go test -count=1 ./caddyconfig/... ./modules/caddyhttp/... > test.log 2>&1 || { tail -30 test.log; exit 1; }

      - name: ts-typecheck (zod v3.23.8 install + tsc)
        if: matrix.workload == 'ts-typecheck'
        run: |
          git clone --depth 1 --branch v3.23.8 https://github.com/colinhacks/zod.git zod
          cd zod
          npm install --no-audit --no-fund --ignore-scripts
          for i in 1 2 3 4 5 6; do
            /usr/bin/time -f "tsc round $i: %e s, %P cpu" npx tsc -p tsconfig.json --noEmit
          done
          for i in 1 2 3; do
            /usr/bin/time -f "jest round $i: %e s, %P cpu" npx jest --ci --silent > jest.log 2>&1 || { tail -30 jest.log; exit 1; }
          done

      - name: io-bound (downloads, image pulls, waits)
        if: matrix.workload == 'io-bound'
        run: |
          for i in 1 2 3; do curl -sSfL -o /dev/null https://github.com/BurntSushi/ripgrep/archive/refs/tags/14.1.1.tar.gz; done
          for img in alpine:3.20 node:20-slim python:3.12-slim; do docker pull -q "$img"; done
          docker run --rm alpine:3.20 sh -c 'apk add --no-cache curl >/dev/null && echo ok'
          sleep 60
