"
            
          elif [ "${{ runner.os }}" == "Windows" ]; then
            # Windows memory stress test using PowerShell
            echo "🪟 Windows Memory Stress Test"
            
            powershell -Command "
            Write-Output '🪟 Windows Memory Stress Test'
            
            # Get system memory info
            \$totalMem = (Get-WmiObject -Class Win32_ComputerSystem).TotalPhysicalMemory
            \$targetMem = \$totalMem * ${{ github.event.inputs.memory_stress_percentage }} / 100
            \$targetMemMB = [math]::Round(\$targetMem / 1MB, 0)
            
            Write-Output \"Target memory allocation: \$targetMemMB MB\"
            
            # Memory stress test
            \$memoryArrays = @()
            \$chunkSizeMB = 10
            \$chunksNeeded = [math]::Floor(\$targetMemMB / \$chunkSizeMB)
            
            Write-Output \"Allocating \$chunksNeeded chunks of \$chunkSizeMB MB each...\"
            
            try {
                for (\$i = 0; \$i -lt \$chunksNeeded; \$i++) {
                    \$chunk = New-Object byte[] (\$chunkSizeMB * 1MB)
                    # Fill with random data
                    \$random = New-Object System.Random
                    \$random.NextBytes(\$chunk)
                    \$memoryArrays += ,\$chunk
                    
                    if ((\$i + 1) % 10 -eq 0) {
                        \$allocatedMB = (\$i + 1) * \$chunkSizeMB
                        Write-Output \"Allocated: \$allocatedMB MB / \$targetMemMB MB\"
                    }
                }
            }
            catch {
                Write-Output \"Memory allocation limit reached at \$(\$memoryArrays.Count * \$chunkSizeMB) MB\"
            }
            
            Write-Output \"Holding memory for ${{ github.event.inputs.sleep_time }} seconds...\"
            \$startTime = Get-Date
            \$endTime = \$startTime.AddSeconds(${{ github.event.inputs.sleep_time }})
            \$iteration = 0
            
            while ((Get-Date) -lt \$endTime) {
                \$iteration++
                
                # Do some work with the memory
                if (\$memoryArrays.Count -gt 0 -and (\$iteration % 100) -eq 0) {
                    \$chunkIndex = Get-Random -Minimum 0 -Maximum \$memoryArrays.Count
                    \$chunk = \$memoryArrays[\$chunkIndex]
                    for (\$j = 0; \$j -lt [math]::Min(1024, \$chunk.Length); \$j += 64) {
                        \$chunk[\$j] = (\$iteration + \$j) % 256
                    }
                }
                
                if ((\$iteration % 1000) -eq 0) {
                    \$elapsed = ((Get-Date) - \$startTime).TotalSeconds
                    Write-Output \"[\$([math]::Round(\$elapsed, 1))s] Memory stress running... (iteration \$iteration)\"
                }
                
                Start-Sleep -Milliseconds 10
            }
            
            Write-Output 'Memory stress test completed!'
            \$memoryArrays = @()
            [System.GC]::Collect()
            Write-Output 'Memory cleanup completed!'
            "
          fi
          
          echo ""
          echo "📊 POST-STRESS MEMORY STATE"
          echo "============================"
          if [ "${{ runner.os }}" == "Linux" ]; then
            echo "Final memory status:"
            free -h
            
          elif [ "${{ runner.os }}" == "macOS" ]; then
            echo "Final memory status:"
            vm_stat
            
          elif [ "${{ runner.os }}" == "Windows" ]; then
            echo "Final memory status:"
            powershell -Command "
            Get-Process | Measure-Object WorkingSet -Sum | Select-Object @{Name='Total Memory Used (MB)'; Expression={[math]::Round(\$_.Sum / 1MB, 2)}}
            "
          fi
          
          echo ""
          echo "🖥️ SYSTEM INFORMATION"
          echo "===================="
          
          # Cross-platform system info
          if [ "${{ runner.os }}" == "Linux" ]; then
            echo "🐧 Linux System:"
            echo "User: $(whoami)"
            echo "Hostname: $(hostname)"
            echo "Uptime: $(uptime)"
            echo "CPU Cores: $(nproc)"
            echo "Memory: $(free -h | grep '^Mem:' | awk '{print $2}')"
            echo "OS: $(cat /etc/os-release | grep PRETTY_NAME | cut -d'\"' -f2)"
            
          elif [ "${{ runner.os }}" == "Windows" ]; then
            echo "🪟 Windows System:"
            powershell -Command "
            Write-Output \"User: \$env:USERNAME\"
            Write-Output \"Computer: \$env:COMPUTERNAME\"
            \$os = Get-ComputerInfo | Select-Object WindowsProductName -ExpandProperty WindowsProductName
            Write-Output \"OS: \$os\"
            \$mem = Get-WmiObject -Class Win32_ComputerSystem
            \$totalMem = [math]::Round(\$mem.TotalPhysicalMemory / 1GB, 2)
            Write-Output \"Memory: \$totalMem GB\"
            "
            
          elif [ "${{ runner.os }}" == "macOS" ]; then
            echo "🍎 macOS System:"
            echo "User: $(whoami)"
            echo "Hostname: $(hostname)"
            echo "macOS Version: $(sw_vers -productVersion)"
            echo "CPU: $(sysctl -n machdep.cpu.brand_string)"
            TOTAL_MEM_BYTES=$(sysctl -n hw.memsize)
            TOTAL_MEM_GB=$((TOTAL_MEM_BYTES / 1024 / 1024 / 1024))
            echo "Memory: ${TOTAL_MEM_GB} GB"
          fi
          
          echo ""
          echo "🌍 GITHUB ENVIRONMENT"
          echo "===================="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Job: $GITHUB_JOB"
          echo "Runner: ${{ github.event.inputs.runs_on }}"
          echo ""
          
          echo "✅ Job ${{ matrix.job_number }} completed successfully"
          echo "🧠 Memory stress test finished at: $(date)"
          echo "🎉 Runner survived the memory stress test!"

  # Summary job to collect results
  execution_summary:
    needs: parallel_jobs
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Memory Stress Test Summary
        run: |
          echo "🧠 MEMORY STRESS TEST SUMMARY"
          echo "============================"
          echo "🎯 Total Jobs: 50"
          echo "🖥️  Runner Used: ${{ github.event.inputs.runs_on }}"
          echo "⏲️ Test Duration Per Job: ${{ github.event.inputs.sleep_time }} seconds"
          echo "📊 Memory Stress Level: ${{ github.event.inputs.memory_stress_percentage }}%"
          echo "🚀 Execution Strategy: All jobs ran in parallel"
          echo "📅 Completion Time: $(date)"
          echo ""
          echo "💡 Test Results:"
          echo "   - All 50 jobs executed memory stress tests simultaneously"
          echo "   - Each job consumed ${{ github.event.inputs.memory_stress_percentage }}% of available memory"
          echo "   - Memory allocation was held for ${{ github.event.inputs.sleep_time }} seconds"
          echo "   - Tests included memory allocation, usage, and cleanup"
          echo "   - Runner type '${{ github.event.inputs.runs_on }}' handled the memory pressure"
          echo ""
          echo "🎉 Memory stress test workflow completed successfully!"

  # Final verification
  verify_system_recovery:
    needs: execution_summary
    runs-on: ${{ github.event.inputs.runs_on }}
    steps:
      - name: System Recovery Verification
        run: |
          echo "🔍 SYSTEM RECOVERY VERIFICATION"
          echo "==============================="
          echo "🖥️  Running on: ${{ github.event.inputs.runs_on }}"
          echo "📅 Verification Time: $(date)"
          echo ""
          
          if [ "${{ runner.os }}" == "Linux" ]; then
            echo "🐧 Linux System Recovery Check:"
            echo "Current memory status:"
            free -h
            echo "System load:"
            uptime
            echo "Available disk space:"
            df -h / | tail -1
            
          elif [ "${{ runner.os }}" == "macOS" ]; then
            echo "🍎 macOS System Recovery Check:"
            echo "Memory status:"
            vm_stat
            echo "System load:"
            uptime
            
          elif [ "${{ runner.os }}" == "Windows" ]; then
            echo "🪟 Windows System Recovery Check:"
            powershell -Command "
            Write-Output 'Memory status:'
            Get-Process | Measure-Object WorkingSet -Sum | Select-Object @{Name='Total Memory Used (MB)'; Expression={[math]::Round(\$_.Sum / 1MB, 2)}}
            Write-Output 'System status: OK'
            "
          fi
          
          echo ""
          echo "✅ System has recovered from memory stress test"
          echo "✅ All 50 parallel jobs completed successfully"
          echo "✅ Memory stress test configuration worked correctly"
          echo "✅ Runner performed well under memory pressure"
          echo ""
          echo "🏁 WORKFLOW COMPLETE"
