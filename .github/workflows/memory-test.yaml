target_mb = $TARGET_MEM_MB
duration = ${{ github.event.inputs.sleep_time }}
chunk_size = 10 * 1024 * 1024  # 10MB chunks
chunks_needed = target_mb // 10
memory_chunks = []

print(f'Allocating {chunks_needed} chunks of 10MB each...')

try:
    for i in range(chunks_needed):
        chunk = bytearray(chunk_size)
        for j in range(0, chunk_size, 1024):
            chunk[j:j+4] = random.randint(0, 2**32-1).to_bytes(4, 'big')
        memory_chunks.append(chunk)
        
        if (i + 1) % 10 == 0:
            allocated_mb = (i + 1) * 10
            print(f'Allocated: {allocated_mb} MB / {target_mb} MB')
            
except MemoryError:
    print(f'Memory limit reached at {len(memory_chunks) * 10} MB')

print(f'Holding memory for {duration} seconds...')
start_time = time.time()
iteration = 0

while time.time() - start_time < duration:
    iteration += 1
