name: 50 Parallel Jobs with Memory Stress Test

on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: 'Specify the runner to use for all 50 jobs'
        required: true
        type: string
        default: 'ubuntu-latest'
      sleep_time:
        description: 'Specify sleep time in seconds'
        required: true
        type: number
        default: 30
      memory_stress_percentage:
        description: 'Percentage of available memory to consume (10-90)'
        required: true
        type: number
        default: 70

jobs:
  # Generate matrix for 50 jobs
  generate_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate Matrix for 50 Jobs
        id: set-matrix
        run: |
          # Generate array for 50 jobs
          JOBS_JSON="["
          for i in $(seq 1 50); do
            if [ $i -gt 1 ]; then
              JOBS_JSON="$JOBS_JSON,"
            fi
            JOBS_JSON="$JOBS_JSON$i"
          done
          JOBS_JSON="$JOBS_JSON]"
          
          echo "matrix={\"job_number\":$JOBS_JSON}" >> $GITHUB_OUTPUT
          echo "Generated matrix for 50 jobs on runner: ${{ github.event.inputs.runs_on }}"
          echo "Jobs array: $JOBS_JSON"

  # 50 parallel jobs with memory stress testing
  parallel_jobs:
    needs: generate_matrix
    runs-on: ${{ github.event.inputs.runs_on }}
    strategy:
      matrix: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}
      fail-fast: false
      max-parallel: 50
    steps:
      - name: Memory Stress Test Job ${{ matrix.job_number }}
        run: |
          echo "🧠 MEMORY STRESS TEST - JOB ${{ matrix.job_number }}"
          echo "================================================"
          echo "📊 Job Number: ${{ matrix.job_number }}"
          echo "🖥️  Runner Type: ${{ github.event.inputs.runs_on }}"
          echo "🌍 Runner OS: ${{ runner.os }}"
          echo "📅 Start Time: $(date)"
          echo "🎯 Memory Stress Target: ${{ github.event.inputs.memory_stress_percentage }}%"
          echo ""
          
          # Get system memory information
          echo "💾 INITIAL MEMORY STATE"
          echo "======================"
          if [ "${{ runner.os }}" == "Linux" ]; then
            echo "Initial memory status:"
            free -h
            TOTAL_MEM_KB=$(grep MemTotal /proc/meminfo | awk '{print $2}')
            AVAILABLE_MEM_KB=$(grep MemAvailable /proc/meminfo | awk '{print $2}')
            echo "Total Memory: $((TOTAL_MEM_KB / 1024)) MB"
            echo "Available Memory: $((AVAILABLE_MEM_KB / 1024)) MB"
            
          elif [ "${{ runner.os }}" == "macOS" ]; then
            echo "Initial memory status:"
            TOTAL_MEM_BYTES=$(sysctl -n hw.memsize)
            TOTAL_MEM_GB=$((TOTAL_MEM_BYTES / 1024 / 1024 / 1024))
            echo "Total Memory: ${TOTAL_MEM_GB} GB"
            vm_stat
            
          elif [ "${{ runner.os }}" == "Windows" ]; then
            echo "Initial memory status:"
            powershell -Command "
            \$mem = Get-WmiObject -Class Win32_ComputerSystem
            \$totalMem = [math]::Round(\$mem.TotalPhysicalMemory / 1GB, 2)
            Write-Output \"Total Memory: \$totalMem GB\"
            Get-Process | Measure-Object WorkingSet -Sum | Select-Object @{Name='Total Memory Used (MB)'; Expression={[math]::Round(\$_.Sum / 1MB, 2)}}
            "
          fi
          echo ""
          
          echo "🚀 STARTING MEMORY STRESS TEST"
          echo "=============================="
          echo "Target: Consume ${{ github.event.inputs.memory_stress_percentage }}% of available memory"
          echo "Duration: ${{ github.event.inputs.sleep_time }} seconds"
          echo "Start Time: $(date)"
          
          if [ "${{ runner.os }}" == "Linux" ]; then
            # Linux memory stress test
            echo "🐧 Linux Memory Stress Test"
            
            # Calculate target memory in MB
            AVAILABLE_MEM_KB=$(grep MemAvailable /proc/meminfo | awk '{print $2}')
            TARGET_MEM_KB=$((AVAILABLE_MEM_KB * ${{ github.event.inputs.memory_stress_percentage }} / 100))
            TARGET_MEM_MB=$((TARGET_MEM_KB / 1024))
            
            echo "Target memory allocation: ${TARGET_MEM_MB} MB"
            
            # Create memory stress test script
            cat > /tmp/memory_stress.py << 'EOF'
import sys
import time
import gc
import threading
import random

class MemoryStresser:
    def __init__(self, target_mb, duration_seconds):
        self.target_mb = target_mb
        self.duration_seconds = duration_seconds
        self.memory_chunks = []
        self.running = True
        
    def allocate_memory(self):
        """Allocate memory in chunks"""
        chunk_size = 10 * 1024 * 1024  # 10MB chunks
        chunks_needed = self.target_mb // 10
        
        print(f"Allocating {chunks_needed} chunks of 10MB each...")
        
        try:
            for i in range(chunks_needed):
                if not self.running:
                    break
                    
                # Create a chunk of random data
                chunk = bytearray(chunk_size)
                # Fill with random data to prevent optimization
                for j in range(0, chunk_size, 1024):
                    chunk[j:j+4] = random.randint(0, 2**32-1).to_bytes(4, 'big')
                
                self.memory_chunks.append(chunk)
                
                if (i + 1) % 10 == 0:
                    allocated_mb = (i + 1) * 10
                    print(f"Allocated: {allocated_mb} MB / {self.target_mb} MB")
                    
        except MemoryError:
            print(f"Memory allocation limit reached at {len(self.memory_chunks) * 10} MB")
            
    def stress_memory(self):
        """Main memory stress function"""
        print("Starting memory allocation...")
        self.allocate_memory()
        
        print(f"Memory allocated! Holding for {self.duration_seconds} seconds...")
        print(f"Total chunks: {len(self.memory_chunks)}")
        print(f"Estimated memory usage: {len(self.memory_chunks) * 10} MB")
        
        # Hold memory and do some work
        start_time = time.time()
        iteration = 0
        
        while time.time() - start_time < self.duration_seconds and self.running:
            iteration += 1
            
            # Do some work with the memory to keep it active
            if self.memory_chunks and iteration % 100 == 0:
                chunk_index = random.randint(0, len(self.memory_chunks) - 1)
                chunk = self.memory_chunks[chunk_index]
                # Write some data to keep memory active
                for i in range(0, min(1024, len(chunk)), 64):
                    chunk[i] = (iteration + i) % 256
                    
            if iteration % 1000 == 0:
                elapsed = time.time() - start_time
                print(f"[{elapsed:.1f}s] Memory stress test running... (iteration {iteration})")
                
            time.sleep(0.01)  # Small sleep to prevent 100% CPU
        
        print("Memory stress test duration completed!")
        self.cleanup()
        
    def cleanup(self):
        """Clean up allocated memory"""
        print("Cleaning up memory...")
        self.running = False
        self.memory_chunks.clear()
        gc.collect()
        print("Memory cleanup completed!")

if __name__ == "__main__":
    target_mb = int(sys.argv[1]) if len(sys.argv) > 1 else 1000
    duration = int(sys.argv[2]) if len(sys.argv) > 2 else 60
    
    print(f"Memory Stress Test Parameters:")
    print(f"Target Memory: {target_mb} MB")
    print(f"Duration: {duration} seconds")
    print("")
    
    stresser = MemoryStresser(target_mb, duration)
    stresser.stress_memory()
EOF
            
            # Run the memory stress test
            python3 /tmp/memory_stress.py $TARGET_MEM_MB ${{ github.event.inputs.sleep_time }} || echo "Memory stress test encountered an issue but continuing..."
            
          elif [ "${{ runner.os }}" == "macOS" ]; then
            # macOS memory stress test
            echo "🍎 macOS Memory Stress Test"
            
            # Get available memory
            TOTAL_MEM_BYTES=$(sysctl -n hw.memsize)
            TARGET_MEM_BYTES=$((TOTAL_MEM_BYTES * ${{ github.event.inputs.memory_stress_percentage }} / 100))
            TARGET_MEM_MB=$((TARGET_MEM_BYTES / 1024 / 1024))
            
            echo "Target memory allocation: ${TARGET_MEM_MB} MB"
            
            # Similar Python script for macOS
            python3 -c "
