name: CPU Stress Test

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use'
        required: true
        default: 'ubuntu-latest'
      duration:
        description: 'Duration in seconds'
        required: true
        default: '60'

jobs:
  stress:
    runs-on: ${{ github.event.inputs.runner }}
    steps:
    - name: Disk Info
      run: df -h

    - name: CPU and Memory Info
      run: |
        lscpu
        free -m
    - name: CPU and Memory Info
      run: |
        echo "==== CPU Info ===="
        echo "CPU Model:"
        grep "model name" /proc/cpuinfo | uniq
    
        echo ""
        echo "Total vCPUs assigned to this VM:"
        nproc
    
        echo ""
        echo "CPU Core Info (sockets, cores per socket, threads per core):"
        lscpu | grep -E 'Socket|Core|Thread'
    
        echo ""
        echo "==== Memory Info ===="
        echo "Total and Available Memory (Human Readable):"
        free -h        
    - name: Install stress-ng
      run: |
        sudo apt-get update
        sudo apt-get install -y stress-ng
    - name: Get CPU info
      run: |
        echo "CPU_CORES=$(nproc)" >> $GITHUB_ENV
        echo "CPU_MODEL=$(lscpu | grep 'Model name' | cut -f 2 -d ":")" >> $GITHUB_ENV
    - name: Run CPU stress test
      run: |
        echo "# CPU Stress Test Results" >> $GITHUB_STEP_SUMMARY
        echo "## Test Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- Duration: ${{ github.event.inputs.duration }} seconds" >> $GITHUB_STEP_SUMMARY
        echo "- CPU Cores: ${{ env.CPU_CORES }}" >> $GITHUB_STEP_SUMMARY
        echo "## Stress Test Output" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        stress-ng --cpu ${{ env.CPU_CORES }} --timeout ${{ github.event.inputs.duration }}s --metrics-brief >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    - name: Add system info to summary
      run: |
        echo "## System Information" >> $GITHUB_STEP_SUMMARY
        echo "- CPU Model: ${{ env.CPU_MODEL }}" >> $GITHUB_STEP_SUMMARY
        echo "- Number of CPU cores: ${{ env.CPU_CORES }}" >> $GITHUB_STEP_SUMMARY
        echo "- Runner: ${{ github.event.inputs.runner }}" >> $GITHUB_STEP_SUMMARY
